name: Deploy API to SmarterASP.NET

on:
  push:
    branches: [master]
    paths:
      - 'AccessoriesStore.Api/**'
      - 'AccessoriesStore.Domain/**'

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AccessoriesStore.Api/AccessoriesStore.Api.csproj

      - name: Publish
        run: dotnet publish AccessoriesStore.Api/AccessoriesStore.Api.csproj -c Release -o ./publish

      - name: Inject production connection string
        shell: pwsh
        run: |
          $configPath = "./publish/appsettings.json"
          $json = Get-Content $configPath -Raw | ConvertFrom-Json
          $json.ConnectionStrings.DefaultConnection = "${{ secrets.DB_CONNECTION_STRING }}"
          $json | ConvertTo-Json -Depth 10 | Set-Content $configPath

      - name: Deploy via Web Deploy
        run: |
          & "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" `
            -verb:sync `
            -source:contentPath="./publish" `
            -dest:contentPath="${{ secrets.WEBSITE_NAME }}",computerName="https://${{ secrets.SERVER_COMPUTER_NAME }}:8172/msdeploy.axd?site=${{ secrets.WEBSITE_NAME }}",username="${{ secrets.SERVER_USERNAME }}",password="${{ secrets.SERVER_PASSWORD }}",authtype="Basic",includeAcls="False" `
            -allowUntrusted