name: Deploy API to SmarterASP.NET

on:
  push:
    branches: [master]
    paths:
      - 'AccessoriesStore.Api/**'
      - 'AccessoriesStore.Domain/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AccessoriesStore.Api/AccessoriesStore.Api.csproj

      - name: Publish
        run: dotnet publish AccessoriesStore.Api/AccessoriesStore.Api.csproj -c Release -o ./publish

      - name: Inject production connection string
        shell: pwsh
        run: |
          $configPath = "./publish/appsettings.json"
          $json = Get-Content $configPath -Raw | ConvertFrom-Json
          $json.ConnectionStrings.DefaultConnection = "${{ secrets.DB_CONNECTION_STRING }}"
          $json | ConvertTo-Json -Depth 10 | Set-Content $configPath

      - name: Deploy via Web Deploy
        shell: pwsh
        run: |
          $site = "${{ secrets.WEBSITE_NAME }}"
          $computerName = "${{ secrets.SERVER_COMPUTER_NAME }}"
          $user = "${{ secrets.SERVER_USERNAME }}"
          $pass = "${{ secrets.SERVER_PASSWORD }}"

          $destArg = "-dest:contentPath=$site,computerName=https://${computerName}:8172/msdeploy.axd?site=$site,username=$user,password=$pass,authtype=Basic,includeAcls=False"

          & "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" -verb:sync -source:contentPath="./publish" $destArg -allowUntrusted